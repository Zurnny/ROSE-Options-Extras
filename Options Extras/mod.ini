Description=Message Colours, Dropped Item Labels and Window Rescue in one: they are also available as separate add-ons. Each part has its own switch or settings in the Add-ons window.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Fixes a freeze when ticking a Dropped Items box in the Add-ons window. New: Group Leader colour in Message Colours; Minimap Window's compass ring with its own switch and map turning; Weapon Refresh merged into HUD Weapon Slot; the default UI Add-ons button uses the game's own button look.
